name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach files to the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = uv run python -c "import xboxsteamsync; print(xboxsteamsync.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match __version__ $version"
          }

      - name: Build
        run: uv run pyinstaller --noconfirm packaging/xss.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/XboxSteamSync -DestinationPath dist/XboxSteamSync-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: XboxSteamSync-windows-x64
          path: dist/XboxSteamSync-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XboxSteamSync-windows-x64.zip
            install.ps1
          generate_release_notes: true
