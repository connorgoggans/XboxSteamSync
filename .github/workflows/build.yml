name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach files to the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = uv run python -c "import xboxsteamsync; print(xboxsteamsync.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match __version__ $version"
          }

      - name: Build
        run: uv run pyinstaller --noconfirm packaging/xss.spec

      # install.ps1 goes inside the zip too: `xss update` runs that copy, which the
      # zip's checksum covers.
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item install.ps1 dist/XboxSteamSync/
          Compress-Archive -Path dist/XboxSteamSync -DestinationPath dist/XboxSteamSync-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/XboxSteamSync-windows-x64.zip).Hash.ToLower()
          Set-Content -Path dist/XboxSteamSync-windows-x64.zip.sha256 -Value "$hash  XboxSteamSync-windows-x64.zip" -NoNewline -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: XboxSteamSync-windows-x64
          path: |
            dist/XboxSteamSync-windows-x64.zip
            dist/XboxSteamSync-windows-x64.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/XboxSteamSync-windows-x64.zip
            dist/XboxSteamSync-windows-x64.zip.sha256
            install.ps1
          generate_release_notes: true
